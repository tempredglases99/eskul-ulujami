  return pageHead('Starting XI',`${+m.format===7?'Format 7 pemain, formasi 2-3-1':'Format 11 pemain, formasi 4-2-3-1'}. Seret pemain ke posisi, atau ketuk posisi lalu pilih pemain.`,`<div style="min-width:260px"><select class="select" id="luMatch">${ms.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${fmtDate(x.date,{short:true})} · vs ${esc(x.opponent)}${x.status==='Terjadwal'?' (terjadwal)':''}</option>`).join('')}</select></div>`,fbCrumb)+
  `<div class="lu-grid"><div class="card card-b"><div class="row" style="justify-content:space-between;margin-bottom:12px"><b>${inXI.size}/${formationOf(m).length} pemain</b><div class="row"><button class="btn btn-sm" data-act="luAuto"><i data-lucide="sparkles"></i>Isi otomatis</button><button class="btn btn-sm btn-ghost" data-act="luClear">Kosongkan</button></div></div>
    <div class="pitch" id="pitch"><div class="stripes"></div>${pitchLines()}${formationOf(m).map(f=>{const sid=L.lineup[f.slot],p=sid&&playerOf(sid);const off=p&&p.position!==f.pos&&p.altPosition!==f.pos&&!(f.pos==='CM'&&['DM','AM'].includes(p.position));
      return `<button class="slot ${sid?'':'empty'} ${f.pos==='GK'?'gk':''}" data-slot="${f.slot}" style="left:${f.x}%;top:${f.y}%" data-act="luPick" aria-label="Posisi ${f.pos}${sid?': '+esc(stuName(sid)):''}"><span class="shirt">${p?p.number:f.pos}</span>${sid?`<span class="lb">${esc(firstName(stuName(sid)))}</span>`:`<span class="lb">${f.pos}</span>`}${off?'<span class="warn-dot" title="Bukan posisi utama/alternatif"></span>':''}</button>`}).join('')}</div>
    <p class="small muted" style="margin:10px 0 0;text-align:center"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#F2B544;vertical-align:-1px"></span> bermain di luar posisi utama/alternatif</p></div>
  <div class="stack"><div class="card"><div class="card-h"><h3>Pilih Pemain</h3><span class="sub">${pool.length} pemain aktif</span></div><div class="card-b"><div class="pool" id="pool">${pool.map(p=>{const s=stuById(p.studentId),used=inXI.has(s.id),bn=L.bench.includes(s.id);
      return `<div class="pool-item ${used?'used':''}" draggable="${!used}" data-sid="${s.id}" style="${UI.lu.hl===s.id?'border-color:var(--pitch);box-shadow:0 0 0 3px var(--pitch-soft)':''}"><span class="jn">${p.number}</span>${avatar(s)}<span style="flex:1;min-width:0"><b style="font-size:13px">${esc(s.name)}</b><div>${posTag(p.position)} ${p.altPosition?`<span class="small muted">${p.altPosition}</span>`:''}</div></span>${used?'<span class="badge b-pitch">XI</span>':`<button class="btn btn-sm ${bn?'btn-soft':'btn-ghost'}" data-act="luBench" data-sid="${s.id}">${bn?'Cadangan ✓':'+ Cadangan'}</button>`}</div>`}).join('')}</div></div></div>
    <div class="card card-b row"><span class="small muted">Cadangan: <b>${L.bench.filter(id=>!inXI.has(id)).length}</b></span><span class="spacer"></span><button class="btn btn-pitch btn-lg" data-act="luSave"><i data-lucide="save"></i>Simpan Line-up</button></div></div></div>`;
},mount(){
  $('#luMatch').onchange=e=>{UI.lu.mid=e.target.value;UI.luDraft=null;render()};
  const pool=$('#pool'),pitch=$('#pitch');
  pool.addEventListener('dragstart',e=>{const it=e.target.closest('.pool-item');if(it)e.dataTransfer.setData('text/plain',it.dataset.sid)});
  pitch.addEventListener('dragstart',e=>{const sl=e.target.closest('.slot');if(sl&&UI.luDraft.lineup[sl.dataset.slot])e.dataTransfer.setData('text/plain',UI.luDraft.lineup[sl.dataset.slot])});
  $$('.slot',pitch).forEach(sl=>{if(UI.luDraft.lineup[sl.dataset.slot])sl.draggable=true;
    sl.addEventListener('dragover',e=>{e.preventDefault();sl.classList.add('over')});sl.addEventListener('dragleave',()=>sl.classList.remove('over'));
    sl.addEventListener('drop',e=>{e.preventDefault();sl.classList.remove('over');const sid=e.dataTransfer.getData('text/plain');if(sid)luAssign(sl.dataset.slot,sid)})});
}};
function luAssign(slot,sid){const L=UI.luDraft;const from=Object.keys(L.lineup).find(k=>L.lineup[k]===sid);const prev=L.lineup[slot];
  if(from)delete L.lineup[from];if(prev&&from)L.lineup[from]=prev;
  if(sid)L.lineup[slot]=sid;else delete L.lineup[slot];L.bench=L.bench.filter(x=>x!==sid);render()}
ACT.luPick=el=>{const slot=el.dataset.slot,f=formationOf(curLuMatch()).find(x=>x.slot===slot),L=UI.luDraft;
  const pool=squadActive().slice().sort((a,b)=>{const r=p=>p.position===f.pos?0:p.altPosition===f.pos?1:2;return r(a)-r(b)||a.number-b.number});
  const m=openModal({title:`Pilih pemain · ${posName(f.pos)}`,body:`<div class="pool">${pool.map(p=>{const s=stuById(p.studentId),at=Object.keys(L.lineup).find(k=>L.lineup[k]===s.id);
    return `<button class="pool-item" style="cursor:pointer;text-align:left" data-sid="${s.id}"><span class="jn">${p.number}</span>${avatar(s)}<span style="flex:1"><b style="font-size:13px">${esc(s.name)}</b><div>${posTag(p.position)} ${p.altPosition?`<span class="small muted">${p.altPosition}</span>`:''}</div></span>${at?`<span class="badge b-idle">${at===slot?'Di posisi ini':'Di '+at.replace(/\d/,'')}</span>`:p.position===f.pos?'<span class="badge b-pitch">Posisi utama</span>':p.altPosition===f.pos?'<span class="badge b-info">Alternatif</span>':''}</button>`}).join('')}</div>`,
    foot:L.lineup[slot]?`<button class="btn btn-danger" data-x="clear"><i data-lucide="user-minus"></i>Kosongkan posisi</button>`:''});
  $$('.pool-item',m).forEach(b=>b.onclick=()=>{closeModal();luAssign(slot,b.dataset.sid)});
  const c=m.querySelector('[data-x=clear]');if(c)c.onclick=()=>{closeModal();delete L.lineup[slot];render()}};
ACT.luBench=el=>{const L=UI.luDraft,sid=el.dataset.sid;L.bench=L.bench.includes(sid)?L.bench.filter(x=>x!==sid):[...L.bench,sid];render()};
ACT.luClear=()=>{UI.luDraft.lineup={};render()};
ACT.luAuto=()=>{const L=UI.luDraft,used=new Set(Object.values(L.lineup));const pool=squadActive();
  [0,1,2].forEach(pass=>formationOf(curLuMatch()).forEach(f=>{if(L.lineup[f.slot])return;const c=pool.find(p=>!used.has(p.studentId)&&(pass===0?p.position===f.pos:pass===1?p.altPosition===f.pos:p.position!=='GK'||f.pos==='GK'));if(c){L.lineup[f.slot]=c.studentId;used.add(c.studentId)}}));
  L.bench=pool.filter(p=>!used.has(p.studentId)).map(p=>p.studentId);toast('Line-up diisi berdasarkan posisi utama, lalu alternatif. Silakan koreksi.','info');render()};
ACT.luSave=()=>{const m=FB().matches.find(x=>x.id===UI.lu.mid),L=UI.luDraft;const inXI=new Set(Object.values(L.lineup));
  if(inXI.size<formationOf(m).length&&m.status==='Selesai')toast(`Line-up tersimpan dengan ${inXI.size} pemain.`,'warn');
  upsert('matches',{...m,lineup:{...L.lineup},bench:L.bench.filter(x=>!inXI.has(x))});
  const act=S.activities.find(a=>a.type==='Pertandingan'&&a.date===m.date&&a.eskulId===E());if(act)upsert('activities',{...act,participantIds:[...inXI,...L.bench.filter(x=>!inXI.has(x))]});
  toast('Line-up disimpan.');render()};

/* ----- Statistik Pemain ----- */
UI.stt={sort:'mins',dir:-1,kelas:''};
fbRoutes.statistik={label:'Statistik Pemain',icon:'activity',render(){
  const f=UI.stt;const rows=squadAll().filter(p=>stuById(p.studentId)&&(!f.kelas||levelOf(stuById(p.studentId).kelas)===f.kelas)).map(p=>({p,s:stuById(p.studentId),...playerStats(p.studentId)}));
  const activeRows=rows.filter(r=>isPlayable(r.p));const avgMin=activeRows.length?activeRows.reduce((t,r)=>t+r.mins,0)/activeRows.length:0;
  rows.sort((a,b)=>{const va=f.sort==='name'?a.s.name:(a[f.sort]??-1),vb=f.sort==='name'?b.s.name:(b[f.sort]??-1);return (typeof va==='string'?va.localeCompare(vb):va-vb)*f.dir});
  const th=(k,l,cls='c')=>`<th class="${cls} sortable" data-act="sttSort" data-k="${k}">${l}${f.sort===k?(f.dir>0?' ▲':' ▼'):''}</th>`;
  return pageHead('Statistik Pemain','Data pembinaan, bukan peringkat. Gunakan untuk memastikan setiap anak mendapat kesempatan bermain dan berkembang.',`<select class="select" id="sttKelas" style="width:auto"><option value="">Semua kelas</option>${LEVELS.map(l=>`<option value="${l}" ${f.kelas===l?'selected':''}>Kelas ${l}</option>`).join('')}</select><button class="btn" data-act="sttCSV"><i data-lucide="download"></i>Export CSV</button>`,fbCrumb)+
  `<div class="split" style="margin-bottom:16px"><div class="card"><div class="card-h"><h3>Pemerataan Menit Bermain</h3><span class="sub">Rata-rata ${Math.round(avgMin)} menit per pemain aktif</span></div><div class="card-b"><div class="chart-box lg"><canvas id="chMin"></canvas></div></div></div>
  <div class="card card-b stack" style="gap:12px"><h3 style="font-size:15px">Perlu Kesempatan Bermain</h3><p class="small muted" style="margin:0">Pemain aktif dengan menit bermain di bawah 50% rata-rata tim.</p>
  ${activeRows.filter(r=>r.mins<avgMin*.5).map(r=>`<div class="row"><div class="person" style="flex:1">${avatar(r.s)}<span><b>${esc(r.s.name)}</b><small>${r.p.position} · ${r.mins} menit · hadir latihan ${Math.round(r.trainPct)}%</small></span></div><button class="btn btn-sm btn-soft" data-nav="lineup" data-p='${JSON.stringify({sid:r.s.id})}'>Line-up</button></div>`).join('')||'<div class="note good"><i data-lucide="circle-check"></i><div>Menit bermain sudah cukup merata.</div></div>'}</div></div>
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c">#</th>${th('name','Pemain','')}<th>Posisi</th>${th('played','Match')}${th('starts','Starting XI')}${th('trainPct','Hadir Latihan')}${th('mins','Menit')}${th('goals','Gol')}${th('assists','Assist')}${th('cs','Clean Sheet')}${th('avgSkill','Rata² Skill')}</tr></thead><tbody>
  ${rows.map(r=>`<tr style="${isPlayable(r.p)?'':'opacity:.6'}"><td class="c"><b style="font-family:var(--font-num);font-size:17px">${r.p.number}</b></td><td><button class="person" style="border:0;background:none;padding:0;cursor:pointer;text-align:left" data-nav="player" data-p='${JSON.stringify({sid:r.s.id})}'>${avatar(r.s)}<span><b>${esc(r.s.name)}</b><small>${esc(r.s.kelas)}${isPlayable(r.p)?'':' · tidak aktif'}</small></span></button></td><td>${posTag(r.p.position)}</td>
    <td class="c num">${r.played}</td><td class="c num">${r.starts}</td><td class="c num">${r.trainTotal?Math.round(r.trainPct)+'%':'–'}</td><td class="c num"><b>${r.mins}</b>${isPlayable(r.p)&&r.mins<avgMin*.5?' <span class="badge b-warn">↓</span>':''}</td><td class="c num">${r.goals}</td><td class="c num">${r.assists}</td><td class="c num">${r.p.position==='GK'?r.cs:'–'}</td><td class="c num">${r.avgSkill?fmtNum(r.avgSkill,2):'–'}</td></tr>`).join('')}
  </tbody></table></div></div>`;
},mount(){$('#sttKelas').onchange=e=>{UI.stt.kelas=e.target.value;render()};
  const rows=squadActive().map(p=>({n:firstName(stuName(p.studentId)),m:playerStats(p.studentId).mins})).sort((a,b)=>b.m-a.m);const avg=rows.reduce((t,r)=>t+r.m,0)/(rows.length||1);
  mkChart('chMin',{type:'bar',data:{labels:rows.map(r=>r.n),datasets:[{label:'Menit bermain',data:rows.map(r=>r.m),backgroundColor:rows.map(r=>r.m<avg*.5?cssVar('--warn'):cssVar('--pitch')),borderRadius:6,maxBarThickness:28}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.raw} menit`}}},scales:{y:gridScale({beginAtZero:true,title:{display:true,text:'menit',color:cssVar('--muted'),font:{size:11}}}),x:gridScale({grid:{display:false},ticks:{autoSkip:false,maxRotation:60,minRotation:0,color:cssVar('--muted'),font:{size:10.5}}})}}})}};
ACT.sttSort=el=>{const k=el.dataset.k;if(UI.stt.sort===k)UI.stt.dir*=-1;else{UI.stt.sort=k;UI.stt.dir=k==='name'?1:-1}render()};
ACT.sttCSV=()=>{const rows=squadAll().filter(p=>stuById(p.studentId)).map(p=>({p,s:stuById(p.studentId),...playerStats(p.studentId)}));
  saveFile(`statistik-pemain-${todayStr()}.csv`,csv([['No Punggung','ID','Nama','Kelas','Posisi','Status','Match','Starting XI','Hadir Latihan (%)','Menit','Gol','Assist','Clean Sheet','Rata-rata Skill'],...rows.map(r=>[r.p.number,r.s.id,r.s.name,r.s.kelas,r.p.position,isPlayable(r.p)?'Aktif':'Tidak Aktif',r.played,r.starts,r.trainPct,r.mins,r.goals,r.assists,r.p.position==='GK'?r.cs:'',r.avgSkill?r.avgSkill.toFixed(2):''])]),'text/csv')};

<script>
/* =====================================================================
   BLOK BERSAMA (dipakai ketujuh eskul, isinya mengikuti eskul aktif)
   Keterampilan · Materi & Penguasaan · Perkembangan · Agenda & Lomba ·
   Prestasi · Kalender Gabungan · Rapor Eskul
   ===================================================================== */
const ext=(sid,e)=>memberOf(sid,e||E())?.extra||{};
function setExt(sid,patch,e){e=e||E();const m=memberOf(sid,e);if(!m)return false;return upsert('memberships',{...m,extra:{...(m.extra||{}),...patch}})}
const catalog=(kind,e)=>S.catalog.filter(c=>c.eskulId===(e||E())&&c.kind===kind).sort((a,b)=>a.seq-b.seq);
function groupsOf(items){const g=[];items.forEach(i=>{let x=g.find(y=>y.name===i.grp);if(!x)g.push(x={name:i.grp,items:[]});x.items.push(i)});return g}
const masteryRec=(sid,e)=>S.mastery.find(m=>m.studentId===sid&&m.eskulId===(e||E()));
const mastery=(sid,itemId,e)=>masteryRec(sid,e)?.items?.[itemId]?.s||0;
function setMastery(sid,itemId,s,e){e=e||E();const r=masteryRec(sid,e)||{id:`MST-${e}-${sid}`,eskulId:e,studentId:sid,items:{}};const items={...r.items};if(s)items[itemId]={s,d:todayStr()};else delete items[itemId];return upsert('mastery',{...r,items})}
const MS=[{label:'Belum',cls:'b-idle'},{label:'Latihan',cls:'b-warn'},{label:'Kuasai',cls:'b-ok'}];
function nextSeq(){return Math.max(0,...S.catalog.map(c=>+c.seq||0))+1}
const eventsOf=(type,e)=>S.events.filter(x=>x.eskulId===(e||E())&&(!type||x.type===type)).sort((a,b)=>a.date.localeCompare(b.date));
const skillHistE=(sid,e)=>S.skills.filter(x=>x.studentId===sid&&x.eskulId===(e||E())).sort((a,b)=>a.date.localeCompare(b.date));
function memberSelect(id,cur,list){list=list||students({active:true}).sort((a,b)=>a.name.localeCompare(b.name,'id'));
  return `<select class="select" id="${id}">${list.map(s=>`<option value="${s.id}" ${s.id===cur?'selected':''}>${esc(s.name)} · ${esc(s.kelas)}</option>`).join('')}</select>`}
function progBar(k,l,t){return `<div class="prog" title="${k} kuasai, ${l} latihan dari ${t}"><i class="k" style="width:${t?k/t*100:0}%"></i><i class="l" style="width:${t?l/t*100:0}%"></i></div>`}
const eskCrumb=()=>`<div class="crumb" style="color:${eskulObj().color}"><i data-lucide="${eskulObj().icon}"></i>${esc(eskulObj().name)}</div>`;
function eskChip(e){const x=eskulById(e);return `<span class="esk-chip"><span class="esk-dot" style="background:${x.color}"></span>${esc(x.name)}</span>`}
function groupAvgE(sc,gk,e){const g=RG(e).find(x=>x.key===gk);if(!g)return 0;const v=g.items.map(([k])=>+sc[k]||0).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function skillAvgE(sc,e){const v=RK(e).map(([k])=>+sc[k]||0).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}

/* ---------- Keterampilan (rubrik per eskul) ---------- */
UI.sk={sid:'',date:null,ref:''};UI.skDraft={};
route('skill',{label:'Penilaian Keterampilan',icon:'target',render(){
  if(UI.params.sid)UI.sk.sid=UI.params.sid;
  if(UI.params.training){UI.sk.ref=UI.params.training;const t=S.football.training.find(x=>x.id===UI.params.training);if(t)UI.sk.date=t.date}
  const list=students({active:true}).sort((a,b)=>a.name.localeCompare(b.name,'id')),max=RMAX();
  if(!list.length)return pageHead('Penilaian Keterampilan','','',eskCrumb())+'<div class="card empty">Belum ada peserta aktif.</div>';
  if(!UI.sk.sid||!list.find(s=>s.id===UI.sk.sid))UI.sk.sid=list[0].id;if(!UI.sk.date)UI.sk.date=todayStr();
  const s=stuById(UI.sk.sid),hist=skillHistE(s.id),ex=hist.find(x=>x.date===UI.sk.date&&!S.works.some(w=>w.id===x.refId)),last=hist[hist.length-1];
  UI.skDraft=ex?{...ex.scores}:(last?{...last.scores}:{});
  const refs=activeModule()==='football'?S.football.training.filter(t=>t.eskulId===E()).sort((a,b)=>b.date.localeCompare(a.date)).map(t=>[t.id,`#${t.number} · ${t.theme}`]):[];
  const legend=Array.from({length:max},(_,i)=>`<b>${i+1}</b> ${scaleLabel(i+1)}`).join(' · ');
  return pageHead('Penilaian Keterampilan',`Rubrik ${esc(eskulObj().name)} skala 1–${max}: ${legend}. Nilai awal diisi dari penilaian terakhir agar cepat dikoreksi.`,'',eskCrumb())+
  `<div class="split-r"><div class="card"><div class="card-h"><h3>Form Penilaian</h3>${ex?'<span class="badge b-info">Mengedit penilaian tanggal ini</span>':last?'<span class="badge b-idle">Diisi dari penilaian terakhir</span>':''}</div><div class="card-b">

    let seq=nextSeq();const keep=new Set();
    want.forEach((w,i)=>{const ex=items.find(c=>c.name===w.name&&c.grp===w.grp&&!keep.has(c.id))||items.find(c=>c.name===w.name&&!keep.has(c.id));

      else{const id=newId('CAT');keep.add(id);upsert('catalog',{id,eskulId:E(),kind,grp:w.grp,name:w.name,seq:seq+i,meta:opts.meta?{...opts.meta}:{}})}});

function overlap(a1,a2,b1,b2){return (a1||'00:00')<(b2||'23:59')&&(b1||'00:00')<(a2||'23:59')}
function conflictsIn(month){const allowed=allowedEskuls(),sch=S.schedules.filter(s=>s.date.startsWith(month)&&s.status!=='Dibatalkan'&&allowed.includes(s.eskulId));const out=[];
  for(let i=0;i<sch.length;i++)for(let j=i+1;j<sch.length;j++){const a=sch[i],b=sch[j];if(a.date!==b.date||a.eskulId===b.eskulId||!overlap(a.startTime,a.endTime,b.startTime,b.endTime))continue;
    if(a.place&&a.place===b.place)out.push({kind:'tempat',a,b,text:`${eskulById(a.eskulId).name} dan ${eskulById(b.eskulId).name} sama-sama memakai ${a.place}`});
    const ma=new Set(S.memberships.filter(m=>m.eskulId===a.eskulId&&m.status==='Aktif').map(m=>m.studentId)),both=S.memberships.filter(m=>m.eskulId===b.eskulId&&m.status==='Aktif'&&ma.has(m.studentId)).map(m=>m.studentId);
    if(both.length)out.push({kind:'siswa',a,b,ids:both,text:`${both.length} siswa ikut ${eskulById(a.eskulId).name} dan ${eskulById(b.eskulId).name} di jam yang sama`})}
  return out}
route('kalender',{label:'Kalender Gabungan',icon:'calendar-range',render(){
  const k=UI.kl;if(!k.month)k.month=todayStr().slice(0,7);const allowed=allowedEskuls().filter(e=>!k.hide.includes(e));
  const [y,mo]=k.month.split('-').map(Number),first=new Date(y,mo-1,1,12),off=(first.getDay()+6)%7,start=new Date(y,mo-1,1-off,12);
  const by={};S.schedules.filter(s=>allowed.includes(s.eskulId)&&s.status!=='Dibatalkan').forEach(s=>(by[s.date]=by[s.date]||[]).push(s));
  S.events.filter(x=>allowed.includes(x.eskulId)).forEach(x=>(by[x.date]=by[x.date]||[]).push({...x,isEvent:true}));
  const conf=conflictsIn(k.month).filter(c=>allowed.includes(c.a.eskulId)&&allowed.includes(c.b.eskulId)),cdates=new Set(conf.map(c=>c.a.date));
  let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=dstr(d),ev=(by[ds]||[]).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));if(i>=35&&d.getMonth()!==mo-1)break;
    cells+=`<div class="day ${d.getMonth()!==mo-1?'out':''} ${ds===todayStr()?'today':''}" style="${cdates.has(ds)?'border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)':''}"><span class="d">${d.getDate()}</span>${ev.slice(0,3).map(x=>`<span class="ev esk" title="${esc(eskulById(x.eskulId).name)} · ${esc(x.title)}"><span class="esk-dot" style="background:${eskulById(x.eskulId).color}"></span>${x.isEvent?'★ ':''}${esc(eskulById(x.eskulId).name.split(' ')[0])} ${fmtTime(x.startTime)}</span>`).join('')}${ev.length>3?`<span class="small muted">+${ev.length-3}</span>`:''}</div>`}
  return pageHead('Kalender Gabungan','Jadwal semua eskul dalam satu kalender. Tanggal bergaris merah menandai bentrok tempat atau siswa yang ikut dua eskul pada jam yang sama.')+
  `<div class="chipbar">${allowedEskuls().map(e=>`<button class="btn btn-sm ${k.hide.includes(e)?'':'btn-soft'}" data-act="klToggle" data-e="${e}" aria-pressed="${!k.hide.includes(e)}"><span class="esk-dot" style="background:${eskulById(e).color};${k.hide.includes(e)?'opacity:.3':''}"></span>${esc(eskulById(e).name)}</button>`).join('')}</div>
  <div class="split"><div class="card"><div class="card-b"><div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn btn-sm btn-icon" data-act="klMonth" data-d="-1" aria-label="Bulan sebelumnya"><i data-lucide="chevron-left"></i></button><h3 style="font-size:16px">${BULAN[mo-1]} ${y}</h3><button class="btn btn-sm btn-icon" data-act="klMonth" data-d="1" aria-label="Bulan berikutnya"><i data-lucide="chevron-right"></i></button></div>
    <div class="cal">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div><p class="small muted" style="margin:10px 0 0">★ = agenda tampil, lomba, atau upacara.</p></div></div>
  <div class="card"><div class="card-h"><h3>Bentrok bulan ini</h3><span class="badge ${conf.length?'b-bad':'b-ok'}">${conf.length||'Tidak ada'}</span></div><div class="card-b" style="padding-top:6px">
    ${conf.length?conf.slice(0,30).map(c=>`<div class="conflict"><i data-lucide="${c.kind==='tempat'?'map-pin':'users'}" style="color:var(--bad);flex:none;margin-top:2px"></i><div><b>${fmtDate(c.a.date,{day:true,short:true})} · ${timeRange(c.a.startTime,c.a.endTime)}</b><div class="muted">${esc(c.text)}${c.ids?`: ${c.ids.slice(0,4).map(id=>esc(firstName(stuName(id)))).join(', ')}${c.ids.length>4?'…':''}`:''}</div></div></div>`).join(''):'<p class="small muted" style="margin:0">Semua jadwal aman.</p>'}</div></div></div>`;
}});

/* ---------- Rapor Eskul (deskripsi otomatis) ---------- */
function semesterOf(d){const [y,m]=d.split('-').map(Number);return m>=7?`${y}/${y+1}-1`:`${y-1}/${y}-2`}
function semRange(sem){const [yy,n]=sem.split('-');const [a,b]=yy.split('/').map(Number);return n==='1'?[`${a}-07-01`,`${a}-12-31`]:[`${b}-01-01`,`${b}-06-30`]}
const PRED=[['Sangat Baik','b-ok'],['Baik','b-info'],['Cukup','b-warn'],['Perlu Bimbingan','b-bad']];
function reportData(sid,sem){const [a,b]=semRange(sem),inR=d=>d>=a&&d<=b;
  const att=studentAtt(sid,x=>inR(x.date)),sk=skillHistE(sid).filter(x=>inR(x.date)),last=sk[sk.length-1],max=RMAX();
  const ga=genAssessments().filter(x=>x.studentId===sid&&inR(x.period+'-01')).sort((x,y)=>x.period.localeCompare(y.period)),gl=ga[ga.length-1];
  const items=catalog('materi'),kuasai=items.filter(i=>mastery(sid,i.id)===2).length;
  const ranked=last?RK().map(([k,l])=>[l.split(' (')[0].toLowerCase(),+last.scores[k]||0]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]):[];
  const skillPct=last?skillAvgE(last.scores)/max:null,sikap=gl?genAvg(gl.scores)/4:null,attPct=att.total?att.pct/100:null;
  const parts=[skillPct,sikap,attPct].filter(x=>x!==null),score=parts.length?parts.reduce((x,y)=>x+y,0)/parts.length:null;
  const pred=score===null?null:score>=.85?0:score>=.7?1:score>=.55?2:3;
  return {att,last,ranked,gl,kuasai,items:items.length,pred,score}}
function genReport(sid,sem){const s=rawStu(sid),d=reportData(sid,sem),e=eskulObj(),x=ext(sid),max=RMAX(),out=[];
  const nm=`Ananda ${s.name}`;
  if(d.att.total)out.push(`${nm} ${d.att.pct>=90?'selalu hadir dan aktif':d.att.pct>=75?'rutin hadir':'perlu lebih rutin hadir'} dalam latihan ${e.name.toLowerCase()} (kehadiran ${fmtPct(d.att.pct)}).`);else out.push(`${nm} mengikuti kegiatan ${e.name.toLowerCase()}.`);
  const good=d.ranked.filter(r=>r[1]>=max*.75).slice(0,2),weak=d.ranked.filter(r=>r[1]<=max*.5).slice(-1);
  if(good.length)out.push(`Menunjukkan kemampuan ${good[0][1]>=max?'sangat baik':'baik'} dalam ${good.map(r=>r[0]).join(' dan ')}.`);
  if(weak.length)out.push(`Masih perlu berlatih ${weak[0][0]}.`);
  if(d.items)out.push(`Telah menguasai ${d.kuasai} dari ${d.items} materi.`);
  if(E()==='silat'&&x.sabuk)out.push(`Saat ini menyandang sabuk ${S.catalog.find(c=>c.id===x.sabuk)?.name.toLowerCase()||'-'}.`);
  if(E()==='pramuka'&&x.golongan){const l=(x.lulus||[]).slice(-1)[0];out.push(l?`Telah dilantik sebagai ${x.golongan} ${l.tingkat}.`:`Sedang menempuh SKU ${x.golongan} ${x.tingkat}.`)}
  if(E()==='menggambar'){const n=S.works.filter(w=>w.studentId===sid).length;if(n)out.push(`Telah menghasilkan ${n} karya selama semester ini.`)}
  if(E()==='marawis'&&x.alat)out.push(`Berperan sebagai pemain ${x.alat.toLowerCase()} dalam grup.`);
  if(d.gl){const v=genAvg(d.gl.scores);out.push(v>=3.5?'Sikap disiplin, tanggung jawab, dan sportivitasnya patut dicontoh.':v>=2.5?'Sikap disiplin dan kerja samanya baik.':'Perlu bimbingan untuk meningkatkan disiplin dan kerja sama.')}
  const ach=S.achievements.filter(a=>a.eskulId===E()&&a.studentIds.includes(sid)&&a.date>=semRange(sem)[0]&&a.date<=semRange(sem)[1]);
  if(ach.length)out.push(`Meraih ${ach.map(a=>`${a.rank} ${a.title}`).join(' dan ')}.`);
  return {text:out.join(' '),pred:d.pred===null?'':PRED[d.pred][0]}}

  `<div class="note" style="margin-bottom:16px"><i data-lucide="info"></i><div>Teks berlabel <b>Draf</b> belum disimpan. Predikat dihitung dari rata-rata rubrik, sikap, dan kehadiran (Sangat Baik ≥ 85%, Baik ≥ 70%, Cukup ≥ 55%).</div></div>

      <div><textarea class="textarea" data-rp="${s.id}" data-pred="${esc(g.pred)}" aria-label="Deskripsi rapor ${esc(s.name)}">${esc(g.text)}</textarea><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn btn-sm btn-ghost" data-act="rpOne" data-id="${s.id}"><i data-lucide="refresh-cw"></i>Susun ulang</button><button class="btn btn-sm btn-soft" data-act="rpSave" data-id="${s.id}"><i data-lucide="save"></i>Simpan</button></div></div></div>`}).join('')||'<div class="empty">Belum ada peserta aktif.</div>'}</div>`;
},mount(){$('#rpSem').onchange=e=>{UI.rp.sem=e.target.value;render()}}});
function rpSave(sid){const ta=$(`[data-rp="${sid}"]`);if(!ta)return false;return upsert('reportNotes',{id:`RPT-${E()}-${sid}-${UI.rp.sem}`,eskulId:E(),studentId:sid,semester:UI.rp.sem,predikat:ta.dataset.pred,text:ta.value.trim()})}
ACT.rpSave=el=>{if(rpSave(el.dataset.id)){toast('Deskripsi disimpan.');render()}};

ACT.rpRegen=async()=>{if(!await confirmBox({title:'Susun ulang semua deskripsi?',message:'Teks di layar diganti dengan susunan otomatis terbaru. Deskripsi yang sudah tersimpan baru berubah setelah Anda menekan Simpan.',okText:'Susun ulang'}))return;$$('[data-rp]').forEach(ta=>{const g=genReport(ta.dataset.rp,UI.rp.sem);ta.value=g.text;ta.dataset.pred=g.pred});toast('Deskripsi disusun ulang.','info')};

</script>

.tog button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.upc{padding:16px;display:flex;flex-direction:column;gap:10px}
.upc-roles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:4px 12px;font-size:12.5px}
.upc-roles dt{color:var(--muted)} .upc-roles dd{margin:0;font-weight:600}
.upc-roles dd.empty{color:var(--bad);font-weight:500}
.upc-empty{margin:6px 0 0;font-size:12.5px;color:var(--bad)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.work{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
.work:hover{transform:translateY(-2px)}
.work .img{aspect-ratio:4/3;background:var(--surface-3);position:relative}
.work .img img{width:100%;height:100%;object-fit:cover;display:block}
.work .star{position:absolute;top:8px;right:8px;background:#F2B544;color:#3a2a00;border-radius:99px;font-size:11px;font-weight:800;padding:2px 8px}
.work .bd{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.work .bd b{font-size:13px}.work .bd small{color:var(--muted);font-size:11.5px}
.big-img{width:100%;border-radius:12px;background:var(--surface-3);aspect-ratio:4/3;object-fit:contain}
.alat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.song:last-child{border-bottom:0}
.song details{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap}
.ragam{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.esk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 16px}
@media (max-width:760px){.song{grid-template-columns:minmax(0,1fr)}.upc-roles{grid-template-columns:minmax(0,1fr)}.upc-roles dd{margin-bottom:4px}}
</style>
<script>
/* =====================================================================
   LAYER 2 — FITUR KHUSUS 6 ESKUL (Sepak Bola ada di modul sendiri)
   ===================================================================== */
const memberRows=(filter=()=>true)=>students({active:true}).filter(filter).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.name.localeCompare(b.name,'id'));
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('Disalin. Tempel di WhatsApp.')).catch(()=>saveFile('teks.txt',t))}catch(e){saveFile('teks.txt',t)}}

/* ---------- PENCAK SILAT: Sabuk, UKT, Jalur Seni/Tanding ---------- */
const SABUK_COLOR=n=>{n=(n||'').toLowerCase();return n.includes('putih')?'#F7F7F7':n.includes('kuning')?'#F2C230':n.includes('hijau')?'#2E9E5B':n.includes('biru')?'#2F6FD6':n.includes('merah')?'#D6403A':n.includes('coklat')||n.includes('cokelat')?'#8B5A2B':n.includes('hitam')?'#1F1F1F':n.includes('jingga')||n.includes('oranye')?'#E67E22':n.includes('ungu')?'#7D3C98':'#9AA3B5'};
function sabukChip(id){const c=S.catalog.find(x=>x.id===id);return c?`<span class="sabuk"><i style="background:${SABUK_COLOR(c.name)}"></i>${esc(c.name)}</span>`:'<span class="small" style="color:var(--warn)">Belum ditetapkan</span>'}
const nextSabuk=id=>{const l=catalog('sabuk','silat'),i=l.findIndex(c=>c.id===id);return i<0?l[0]:l[i+1]};
const silatRoutes={};
silatRoutes.sabuk={label:'Sabuk, UKT & Jalur',icon:'award',render(){
  const sab=catalog('sabuk'),rows=memberRows(),ukt=eventsOf('UKT').reverse(),t=todayStr();
  const jal=k=>rows.filter(s=>(ext(s.id).jalur||[]).includes(k)).length;
  return pageHead('Sabuk, UKT & Jalur','Tingkatan sabuk mengikuti perguruan sekolah. Setiap pesilat ditetapkan ke jalur Seni, Tanding, atau keduanya.',`<button class="btn" data-act="sbOrder"><i data-lucide="list-ordered"></i>Atur urutan sabuk</button><button class="btn btn-primary" data-act="uktAdd"><i data-lucide="calendar-plus"></i>Jadwalkan UKT</button>`,eskCrumb())+
  `<div class="card card-b" style="margin-bottom:16px"><div class="row" style="gap:18px">${sab.map(c=>`<span class="row" style="gap:8px">${sabukChip(c.id)}<b class="num">${rows.filter(s=>ext(s.id).sabuk===c.id).length}</b></span>`).join('')}<span class="spacer"></span><span class="badge b-primary">Seni ${jal('Seni')}</span><span class="badge b-bad">Tanding ${jal('Tanding')}</span></div></div>
  <div class="split"><div class="card"><div class="card-h"><h3>Pesilat</h3><span class="sub">${rows.length} aktif</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nama</th><th>Sabuk</th><th>Jalur</th><th>Kategori seni</th></tr></thead><tbody>
    ${rows.map(s=>{const x=ext(s.id),j=x.jalur||[];return `<tr><td><div class="person">${avatar(s)}<span><b>${esc(s.name)}</b><small>${esc(s.kelas)}${x.sabukHistory?.length?' · naik '+fmtDate(x.sabukHistory.slice(-1)[0].date,{short:true}):''}</small></span></div></td>
      <td><select class="select" style="height:34px;min-width:120px" data-sabuk="${s.id}"><option value="">—</option>${sab.map(c=>`<option value="${c.id}" ${x.sabuk===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td>
      <td><span class="tog">${['Seni','Tanding'].map(k=>`<button class="${j.includes(k)?'on':''}" data-act="sjJalur" data-sid="${s.id}" data-k="${k}" aria-pressed="${j.includes(k)}">${k}</button>`).join('')}</span></td>
      <td>${j.includes('Seni')?`<select class="select" style="height:34px;width:auto" data-seni="${s.id}">${['Tunggal','Ganda','Regu'].map(k=>`<option ${x.seni===k?'selected':''}>${k}</option>`).join('')}</select>`:'<span class="muted small">—</span>'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="stack"><div class="card"><div class="card-h"><h3>Ujian Kenaikan Tingkat</h3></div><div class="card-b" style="padding-top:6px">${ukt.length?`<ul class="ev-list">${ukt.map(u=>{const lulus=Object.values(u.results||{}).filter(v=>v==='Lulus').length;return `<li><span style="flex:1"><b>${esc(u.title)}</b><div class="small muted">${fmtDate(u.date,{day:true,short:true})} · ${u.participants.length} peserta${lulus?` · ${lulus} lulus`:''}</div></span><span class="badge ${u.date<t?'b-idle':'b-info'}">${u.date<t?'Selesai':'Terjadwal'}</span><button class="btn btn-sm btn-soft" data-act="uktOpen" data-id="${u.id}">Hasil</button></li>`}).join('')}</ul>`:'<p class="small muted" style="margin:0">Belum ada UKT.</p>'}</div></div>
    <div class="note"><i data-lucide="info"></i><div>Urutan sabuk awal hanya contoh. Sesuaikan dengan perguruan lewat <b>Atur urutan sabuk</b>; setiap baris satu tingkatan, dari yang terendah.</div></div></div></div>`;
},mount(v){v.addEventListener('change',e=>{const a=e.target.dataset;if(a.sabuk!==undefined){if(setExt(a.sabuk,{sabuk:e.target.value}))toast('Sabuk diperbarui.')}if(a.seni!==undefined)setExt(a.seni,{seni:e.target.value})})}};
ACT.sjJalur=el=>{const sid=el.dataset.sid,k=el.dataset.k,j=[...(ext(sid).jalur||[])],i=j.indexOf(k);if(i>=0)j.splice(i,1);else j.push(k);if(setExt(sid,{jalur:j,seni:ext(sid).seni||'Tunggal'}))render()};
ACT.sbOrder=()=>catalogEditor('sabuk','Atur urutan sabuk','Satu baris satu sabuk, urut dari tingkat terendah ke tertinggi.',{defaultGroup:'Sabuk'});
ACT.uktAdd=()=>{const rows=memberRows();const m=openModal({title:'Jadwalkan UKT',body:`<div class="form-grid"><div class="field full"><label for="ukTitle">Nama ujian</label><input class="input" id="ukTitle" value="Ujian Kenaikan Tingkat"></div><div class="field"><label for="ukDate">Tanggal</label><input class="input" type="date" id="ukDate" value="${addDays(todayStr(),21)}"></div><div class="field"><label for="ukPlace">Tempat</label><input class="input" id="ukPlace" value="${esc(eskulObj().place)}"></div></div>
  <div class="field"><label>Peserta ujian</label><div class="check-list">${rows.map(s=>`<label><input type="checkbox" value="${s.id}" checked>${avatar(s)}<span style="flex:1">${esc(s.name)}</span>${sabukChip(ext(s.id).sabuk)} → ${sabukChip(nextSabuk(ext(s.id).sabuk)?.id)}</label>`).join('')}</div></div>`,
  foot:`<button class="btn" data-act="closeModal">Batal</button><button class="btn btn-primary" id="ukSave"><i data-lucide="save"></i>Simpan</button>`});
  m.querySelector('#ukSave').onclick=()=>{const p=$$('.check-list input:checked',m).map(i=>i.value);if(!p.length)return toast('Pilih minimal satu peserta.','warn');const d=m.querySelector('#ukDate').value;
    if(upsert('events',{id:newId('UKT'),eskulId:E(),type:'UKT',title:m.querySelector('#ukTitle').value.trim()||'Ujian Kenaikan Tingkat',date:d,startTime:'08:00',place:m.querySelector('#ukPlace').value.trim(),participants:p,roles:{},results:{},notes:'',status:d<=todayStr()?'Selesai':'Terjadwal'})){closeModal();toast('UKT dijadwalkan.');render()}}};
ACT.uktOpen=el=>{const u=S.events.find(x=>x.id===el.dataset.id),done=u.roles?.processed||[];
  const m=openModal({title:u.title,size:'lg',body:`<p class="small muted" style="margin:0">${fmtDate(u.date,{day:true})} · ${esc(u.place)}. Tandai hasil tiap peserta, lalu tekan <b>Proses kenaikan sabuk</b> untuk menaikkan sabuk peserta yang lulus.</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Peserta</th><th>Sabuk saat ini</th><th>Naik ke</th><th>Hasil</th></tr></thead><tbody>${u.participants.map(sid=>{const s=stuById(sid),x=ext(sid),dn=done.includes(sid);
      return `<tr><td><b>${esc(s?.name||'')}</b></td><td>${sabukChip(x.sabuk)}</td><td>${dn?'<span class="badge b-ok">Sudah diproses</span>':sabukChip(nextSabuk(x.sabuk)?.id)}</td><td><select class="select" style="height:34px;width:auto" data-uk="${sid}" ${dn?'disabled':''}>${['','Lulus','Mengulang','Tidak hadir'].map(v=>`<option value="${v}" ${(u.results?.[sid]||'')===v?'selected':''}>${v||'— Belum —'}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table></div>`,
    foot:`<button class="btn" data-act="closeModal">Tutup</button><button class="btn" id="ukRes"><i data-lucide="save"></i>Simpan hasil</button><button class="btn btn-primary" id="ukProc"><i data-lucide="arrow-up-circle"></i>Proses kenaikan sabuk</button>`});
  const collect=()=>{const r={...u.results};$$('[data-uk]',m).forEach(s=>{if(s.value)r[s.dataset.uk]=s.value;else delete r[s.dataset.uk]});return r};
  m.querySelector('#ukRes').onclick=()=>{if(upsert('events',{...u,results:collect()})){closeModal();toast('Hasil UKT disimpan.');render()}};
  m.querySelector('#ukProc').onclick=()=>{const r=collect(),todo=Object.entries(r).filter(([sid,v])=>v==='Lulus'&&!done.includes(sid));if(!todo.length)return toast('Tidak ada peserta lulus yang belum diproses.','info');
    todo.forEach(([sid])=>{const x=ext(sid),nx=nextSabuk(x.sabuk);if(nx)setExt(sid,{sabuk:nx.id,sabukHistory:[...(x.sabukHistory||[]),{date:u.date,from:x.sabuk||'',to:nx.id,eventId:u.id}]})});
    upsert('events',{...u,results:r,roles:{...(u.roles||{}),processed:[...done,...todo.map(t=>t[0])]},status:'Selesai'});closeModal();toast(`${todo.length} pesilat naik sabuk.`);render()};
};
registerModule({id:'silat',navTitle:'Pencak Silat',routes:silatRoutes,nav:[['sabuk','Sabuk, UKT & Jalur','award']]});

/* ---------- PASKIBRA: Jadwal Petugas Upacara ---------- */
const UP_SLOTS=UPACARA_ROLES.flatMap(([k,l,n])=>Array.from({length:n},(_,i)=>({k,i,l:n>1?`${l} ${i+1}`:l})));
function nextMondays(n){const out=[];const d=parseD(todayStr());while(d.getDay()!==1)d.setDate(d.getDate()+1);for(let i=0;i<n;i++){out.push(dstr(d));d.setDate(d.getDate()+7)}return out}
function upEvent(date){return S.events.find(x=>x.eskulId==='paskibra'&&x.type==='Upacara'&&x.date===date)}
function upVirtual(date){return upEvent(date)||{id:`UPC-${date}`,eskulId:'paskibra',type:'Upacara',title:'Upacara Bendera Hari Senin',date,startTime:'07:00',place:'Lapangan Upacara',participants:[],roles:{},results:{},notes:'',status:'Terjadwal'}}
const upFilled=x=>UP_SLOTS.filter(s=>(x.roles?.[s.k]||[])[s.i]).length;
function upDuty(){const c={};S.events.filter(x=>x.eskulId==='paskibra'&&x.type==='Upacara').forEach(x=>Object.entries(x.roles||{}).forEach(([k,ids])=>Array.isArray(ids)&&ids.forEach(id=>{if(!id)return;c[id]=c[id]||{total:0,last:'',by:{}};c[id].total++;c[id].by[k]=(c[id].by[k]||0)+1;if(x.date>c[id].last)c[id].last=x.date})));return c}
function upAuto(x){const duty=upDuty(),rows=memberRows(),prev=S.events.filter(e=>e.eskulId==='paskibra'&&e.type==='Upacara'&&e.date<x.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const prevIds=new Set(Object.values(prev?.roles||{}).flat()),roles=JSON.parse(JSON.stringify(x.roles||{})),used=new Set(Object.values(roles).flat().filter(Boolean));
  const h=id=>{let v=0;for(const ch of id+x.date)v=(v*31+ch.charCodeAt(0))%997;return v};
  UP_SLOTS.forEach(sl=>{roles[sl.k]=roles[sl.k]||[];if(roles[sl.k][sl.i])return;
    const cand=rows.filter(s=>!used.has(s.id)&&!prevIds.has(s.id)).sort((a,b)=>{const pa=(sl.k==='pemimpin'&&levelOf(a.kelas)==='VI'?-2:0)+(duty[a.id]?.total||0),pb=(sl.k==='pemimpin'&&levelOf(b.kelas)==='VI'?-2:0)+(duty[b.id]?.total||0);return pa-pb||h(a.id)-h(b.id)});
    const c=cand[0]||rows.find(s=>!used.has(s.id));if(c){roles[sl.k][sl.i]=c.id;used.add(c.id)}});
  return roles}
function upText(x){return `*${x.title}*\n${fmtDate(x.date,{day:true})} · pukul ${fmtTime(x.startTime)} · ${x.place}\n\n`+UP_SLOTS.map(s=>{const id=(x.roles?.[s.k]||[])[s.i];return `${s.l}: ${id?`${stuName(id)} (${rawStu(id)?.kelas||''})`:'—'}`}).join('\n')+`\n\nMohon hadir 15 menit sebelum upacara dengan seragam lengkap.`}
const paskibraRoutes={};
paskibraRoutes.upacara={label:'Petugas Upacara',icon:'flag',render(){
  const t=todayStr(),future=[...new Set([...nextMondays(5),...S.events.filter(x=>x.eskulId==='paskibra'&&x.type==='Upacara'&&x.date>=t).map(x=>x.date)])].sort().map(upVirtual);
  const past=S.events.filter(x=>x.eskulId==='paskibra'&&x.type==='Upacara'&&x.date<t).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  const duty=upDuty(),rows=memberRows(),avg=rows.length?rows.reduce((a,s)=>a+(duty[s.id]?.total||0),0)/rows.length:0;
  const card=(x,isPast)=>{const f=upFilled(x);return `<article class="card upc"><div class="row" style="justify-content:space-between"><div><b style="font-size:15px">${esc(x.title)}</b><div class="small muted">${fmtDate(x.date,{day:true})} · ${fmtTime(x.startTime)}</div></div><span class="badge ${f===UP_SLOTS.length?'b-ok':f?'b-warn':'b-idle'}">${f}/${UP_SLOTS.length} petugas</span></div>
    ${(()=>{const fill=UP_SLOTS.map(s=>({s,id:(x.roles?.[s.k]||[])[s.i]})).filter(o=>o.id);const kosong=UP_SLOTS.length-fill.length;
      return (fill.length?`<dl class="upc-roles">${fill.map(o=>`<dt>${esc(o.s.l)}</dt><dd>${esc(stuName(o.id))}</dd>`).join('')}</dl>`:'')+(kosong?`<p class="upc-empty">${fill.length?'':'Belum ada petugas · '}${kosong} slot kosong</p>`:'')})()}
    ${isPast?'':`<div class="row" style="padding-top:8px;border-top:1px solid var(--line-2)"><button class="btn btn-sm btn-soft" data-act="upEdit" data-d="${x.date}"><i data-lucide="pencil"></i>Atur</button><button class="btn btn-sm" data-act="upAutoBtn" data-d="${x.date}"><i data-lucide="sparkles"></i>Isi otomatis</button><span class="spacer"></span><button class="btn btn-sm btn-ghost" data-act="upCopy" data-d="${x.date}"><i data-lucide="copy"></i>Salin untuk WA</button></div>`}</article>`};
  return pageHead('Petugas Upacara','Jadwal petugas upacara Senin dan hari besar. Isi otomatis memilih anggota yang paling jarang bertugas dan tidak bertugas minggu sebelumnya.',`<button class="btn btn-primary" data-act="upAdd"><i data-lucide="calendar-plus"></i>Upacara hari besar</button>`,eskCrumb())+
  `<h3 style="font-size:15px;margin:0 0 10px">Akan datang</h3><div class="act-grid">${future.map(x=>card(x,false)).join('')}</div>
  <div class="split" style="margin-top:22px"><div class="card"><div class="card-h"><h3>Rekap tugas anggota</h3><span class="sub">Rata-rata ${fmtNum(avg,1)} kali</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Anggota</th><th class="c">Pemimpin</th><th class="c">Pengibar</th><th class="c">Lainnya</th><th class="c">Total</th><th>Terakhir</th></tr></thead><tbody>
    ${rows.sort((a,b)=>(duty[a.id]?.total||0)-(duty[b.id]?.total||0)).map(s=>{const d=duty[s.id]||{total:0,by:{}},lain=d.total-(d.by.pemimpin||0)-(d.by.pengibar||0);return `<tr><td><div class="person">${avatar(s)}<span><b>${esc(s.name)}</b><small>${esc(s.kelas)}</small></span></div></td><td class="c num">${d.by.pemimpin||0}</td><td class="c num">${d.by.pengibar||0}</td><td class="c num">${lain}</td><td class="c num"><b>${d.total}</b> ${!d.total?'<span class="badge b-warn">belum pernah</span>':d.total>avg+2?'<span class="badge b-late">sering</span>':''}</td><td class="num small">${d.last?fmtDate(d.last,{short:true}):'—'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="stack"><h3 style="font-size:15px;margin:0">Riwayat terakhir</h3>${past.map(x=>card(x,true)).join('')||'<div class="card empty small">Belum ada.</div>'}</div></div>`;
}};
ACT.upAutoBtn=el=>{const x=upVirtual(el.dataset.d);if(upsert('events',{...x,roles:upAuto(x)})){toast('Petugas diisi otomatis. Periksa dan ubah bila perlu.','info');render()}};
ACT.upCopy=el=>copyText(upText(upVirtual(el.dataset.d)));
ACT.upAdd=()=>{const m=openModal({title:'Upacara hari besar',size:'sm',body:`<div class="field"><label for="uhT">Nama upacara</label><input class="input" id="uhT" placeholder="Upacara Hari Pahlawan"></div><div class="field"><label for="uhD">Tanggal</label><input class="input" type="date" id="uhD" value="${todayStr()}"></div><div class="field"><label for="uhJ">Jam</label><input class="input" type="time" id="uhJ" value="07:00"></div>`,foot:`<button class="btn" data-act="closeModal">Batal</button><button class="btn btn-primary" id="uhS">Simpan</button>`});
  m.querySelector('#uhS').onclick=()=>{const tt=m.querySelector('#uhT').value.trim(),d=m.querySelector('#uhD').value;if(!tt)return toast('Isi nama upacara.','warn');if(upsert('events',{...upVirtual(d),id:upEvent(d)?.id||`UPC-${d}`,title:tt,startTime:m.querySelector('#uhJ').value})){closeModal();render()}}};
ACT.upEdit=el=>{const x=upVirtual(el.dataset.d),rows=memberRows();
  const m=openModal({title:`Petugas · ${fmtDate(x.date,{day:true})}`,body:`${UP_SLOTS.map(s=>{const cur=(x.roles?.[s.k]||[])[s.i]||'';return `<div class="field"><label>${esc(s.l)}</label><select class="select" data-k="${s.k}" data-i="${s.i}"><option value="">— Kosong —</option>${rows.map(r=>`<option value="${r.id}" ${r.id===cur?'selected':''}>${esc(r.name)} · ${esc(r.kelas)}</option>`).join('')}</select></div>`}).join('')}<p class="small" id="upErr" style="color:var(--bad);margin:0" hidden></p>`,
    foot:`<button class="btn" data-act="closeModal">Batal</button><button class="btn btn-primary" id="upS"><i data-lucide="save"></i>Simpan</button>`});
  m.querySelector('#upS').onclick=()=>{const roles={},seen=new Set();let dup='';$$('select[data-k]',m).forEach(s=>{roles[s.dataset.k]=roles[s.dataset.k]||[];roles[s.dataset.k][+s.dataset.i]=s.value||'';if(s.value){if(seen.has(s.value))dup=stuName(s.value);seen.add(s.value)}});
    if(dup){const e=m.querySelector('#upErr');e.textContent=`${dup} terpilih lebih dari satu kali.`;e.hidden=false;return}
    if(upsert('events',{...x,roles})){closeModal();toast('Petugas disimpan.');render()}}};
registerModule({id:'paskibra',navTitle:'Paskibra',routes:paskibraRoutes,nav:[['upacara','Petugas Upacara','flag']]});

/* ---------- PRAMUKA: Buku SKU (Siaga/Penggalang) & Barung/Regu ---------- */
UI.sku={tab:'semua'};
const skuItems=(g,t)=>catalog('sku','pramuka').filter(c=>c.grp===`${g}|${t}`);
function skuProg(sid){const x=ext(sid,'pramuka');if(!x.golongan||!TINGKAT[x.golongan]?.includes(x.tingkat))return null;const it=skuItems(x.golongan,x.tingkat);return {done:it.filter(i=>mastery(sid,i.id,'pramuka')===2).length,total:it.length,items:it}}
const pramukaRoutes={};
pramukaRoutes.sku={label:'Buku SKU',icon:'book-check',render(){
  const rows=memberRows(),tab=UI.sku.tab,f=rows.filter(s=>{const g=ext(s.id).golongan||'';return tab==='semua'||(tab==='belum'?!g:g===tab)});
  const n=g=>rows.filter(s=>(ext(s.id).golongan||'')===g).length;
  return pageHead('Buku SKU','Golongan setiap anggota ditetapkan oleh pembina. Butir SKU dan tingkatan mengikuti golongannya: Siaga (Mula, Bantu, Tata) atau Penggalang (Ramu, Rakit, Terap).',`<button class="btn" data-act="skuEdit"><i data-lucide="pencil"></i>Kelola butir SKU</button>`,eskCrumb())+
  `<div class="row" style="margin-bottom:16px"><div class="tabs">${[['semua','Semua',rows.length],['Siaga','Siaga',n('Siaga')],['Penggalang','Penggalang',n('Penggalang')],['belum','Belum ditetapkan',n('')]].map(([k,l,c])=>`<button class="tab ${tab===k?'active':''}" data-act="skuTab" data-t="${k}">${l} <span class="muted">${c}</span></button>`).join('')}</div></div>
  ${n('')?`<div class="note warn" style="margin-bottom:16px"><i data-lucide="triangle-alert"></i><div><b>${n('')} anggota</b> belum ditetapkan golongannya. Pilih Siaga atau Penggalang di kolom Golongan.</div></div>`:''}
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Anggota</th><th>Golongan</th><th>Tingkatan</th><th>Progres SKU</th><th class="r"></th></tr></thead><tbody>
  ${f.map(s=>{const x=ext(s.id),p=skuProg(s.id),lul=(x.lulus||[]);return `<tr><td><div class="person">${avatar(s)}<span><b>${esc(s.name)}</b><small>${esc(s.kelas)}</small></span></div></td>
    <td><select class="select" style="height:34px;width:auto" data-gol="${s.id}"><option value="">— Pilih —</option>${Object.keys(TINGKAT).map(g=>`<option ${x.golongan===g?'selected':''}>${g}</option>`).join('')}</select></td>
    <td>${x.golongan?`<div class="chips">${lul.map(l=>`<span class="badge b-ok">${esc(l.tingkat)} ✓</span>`).join('')}${TINGKAT[x.golongan].includes(x.tingkat)?`<span class="badge b-info">Menempuh ${esc(x.tingkat)}</span>`:'<span class="badge b-ok">SKU lengkap</span>'}</div>`:'<span class="muted small">—</span>'}</td>
    <td style="min-width:160px">${p?`<div class="row" style="gap:8px;flex-wrap:nowrap">${progBar(p.done,0,p.total)}<span class="small num">${p.done}/${p.total}</span></div>`:'<span class="muted small">—</span>'}</td>
    <td class="r">${p?`<button class="btn btn-sm btn-soft" data-act="skuOpen" data-sid="${s.id}"><i data-lucide="book-open"></i>Buka SKU</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5"><div class="empty small">Tidak ada anggota di tab ini.</div></td></tr>'}</tbody></table></div></div>
  <p class="small muted" style="margin-top:10px">Butir SKU awal hanya contoh. Sesuaikan dengan buku SKU resmi lewat <b>Kelola butir SKU</b>.</p>`;
},mount(v){v.addEventListener('change',async e=>{const sid=e.target.dataset.gol;if(sid===undefined)return;const g=e.target.value,x=ext(sid);
  if(x.golongan&&x.golongan!==g&&(x.lulus||[]).length&&!await confirmBox({title:'Ganti golongan?',message:'Riwayat tingkatan di golongan lama akan diganti. Butir yang sudah diuji tetap tersimpan.',okText:'Ganti golongan',danger:true})){render();return}
  if(setExt(sid,{golongan:g,tingkat:g?TINGKAT[g][0]:'',lulus:x.golongan===g?x.lulus:[],kelompokId:x.golongan===g?x.kelompokId:'',kelompokRole:x.golongan===g?x.kelompokRole:''})){toast(g?`Ditetapkan sebagai ${g}.`:'Golongan dikosongkan.');render()}})}};
ACT.skuTab=el=>{UI.sku.tab=el.dataset.t;render()};
ACT.skuEdit=()=>catalogEditor('sku','Kelola butir SKU','Kelompokkan butir per golongan dan tingkatan dengan baris “# Siaga|Mula”, “# Siaga|Bantu”, “# Penggalang|Ramu”, dan seterusnya. Satu baris satu butir.',{defaultGroup:'Siaga|Mula'});
ACT.skuOpen=el=>{const sid=el.dataset.sid,s=stuById(sid),x=ext(sid),p=skuProg(sid);
  const m=openModal({title:`SKU ${x.golongan} ${x.tingkat} · ${s.name}`,body:`<p class="small muted" style="margin:0">Centang butir yang sudah lulus diuji. Perubahan langsung tersimpan.</p>
    <div class="check-list" style="max-height:none">${p.items.map(i=>{const r=masteryRec(sid,'pramuka')?.items?.[i.id];return `<label><input type="checkbox" data-sku="${i.id}" ${r?.s===2?'checked':''}><span style="flex:1">${esc(i.name)}</span>${r?.s===2?`<small class="muted">${fmtDate(r.d,{short:true})}</small>`:''}</label>`}).join('')||'<div class="empty small">Belum ada butir untuk tingkatan ini.</div>'}</div>
    <div class="row small" style="justify-content:space-between"><span id="skuCnt">${p.done}/${p.total} butir lulus</span>${(x.lulus||[]).length?`<span class="muted">Lulus sebelumnya: ${x.lulus.map(l=>`${l.tingkat} (${fmtDate(l.date,{short:true})})`).join(', ')}</span>`:''}</div>`,
    foot:`<button class="btn" data-act="closeModal">Tutup</button><button class="btn btn-primary" id="skuUp" ${p.total&&p.done===p.total?'':'disabled'}><i data-lucide="badge-check"></i>Sahkan ke tingkat berikutnya</button>`});
  m.querySelector('.check-list').onchange=e=>{const id=e.target.dataset.sku;if(!id)return;setMastery(sid,id,e.target.checked?2:0,'pramuka');const q=skuProg(sid);m.querySelector('#skuCnt').textContent=`${q.done}/${q.total} butir lulus`;m.querySelector('#skuUp').disabled=!(q.total&&q.done===q.total)};
  m.querySelector('#skuUp').onclick=()=>{const lv=TINGKAT[x.golongan],i=lv.indexOf(x.tingkat),nx=lv[i+1]||'Lengkap';
    if(setExt(sid,{lulus:[...(x.lulus||[]),{tingkat:x.tingkat,date:todayStr()}],tingkat:nx},'pramuka')){closeModal();toast(`${s.name} disahkan ${x.golongan} ${x.tingkat}.`);render()}}};

UI.rg={gol:'Siaga'};
pramukaRoutes.regu={label:'Barung & Regu',icon:'users-round',render(){
  const gol=UI.rg.gol,kel=catalog('kelompok').filter(k=>k.meta?.golongan===gol),mem=memberRows(s=>ext(s.id).golongan===gol);
  const inK=k=>mem.filter(s=>ext(s.id).kelompokId===k.id).sort((a,b)=>({Pemimpin:0,Wakil:1}[ext(a.id).kelompokRole]??2)-({Pemimpin:0,Wakil:1}[ext(b.id).kelompokRole]??2));
  const none=mem.filter(s=>!kel.some(k=>k.id===ext(s.id).kelompokId));
  return pageHead('Barung & Regu','Siaga dikelompokkan dalam barung, Penggalang dalam regu. Poin dipakai untuk lomba ringan antarkelompok saat latihan.',`<button class="btn btn-primary" data-act="rgAdd"><i data-lucide="plus"></i>Tambah ${gol==='Siaga'?'barung':'regu'}</button>`,eskCrumb())+
  `<div class="row" style="margin-bottom:16px"><div class="tabs">${['Siaga','Penggalang'].map(g=>`<button class="tab ${gol===g?'active':''}" data-act="rgTab" data-g="${g}">${g==='Siaga'?'Barung (Siaga)':'Regu (Penggalang)'}</button>`).join('')}</div></div>
  <div class="act-grid">${kel.sort((a,b)=>(b.meta.poin||0)-(a.meta.poin||0)).map((k,i)=>`<article class="card act-card"><div class="row" style="justify-content:space-between"><h4>${i===0&&(k.meta.poin||0)>0?'🏆 ':''}${esc(k.name)}</h4><div class="row" style="gap:6px"><button class="btn btn-sm btn-icon" data-act="rgPoin" data-id="${k.id}" data-d="-5" aria-label="Kurangi 5 poin">−</button><b class="num" style="font-size:18px;min-width:34px;text-align:center">${k.meta.poin||0}</b><button class="btn btn-sm btn-icon" data-act="rgPoin" data-id="${k.id}" data-d="5" aria-label="Tambah 5 poin">+</button></div></div>
    <div class="stack" style="gap:6px">${inK(k).map(s=>`<div class="person">${avatar(s)}<span><b>${esc(s.name)}</b><small>${esc(s.kelas)}</small></span>${ext(s.id).kelompokRole?`<span class="badge ${ext(s.id).kelompokRole==='Pemimpin'?'b-primary':'b-info'}" style="margin-left:auto">${ext(s.id).kelompokRole}</span>`:''}</div>`).join('')||'<span class="small muted">Belum ada anggota.</span>'}</div>
    <div class="foot"><span class="small muted">${inK(k).length} anggota</span><span class="spacer"></span><button class="btn btn-sm btn-soft" data-act="rgEdit" data-id="${k.id}"><i data-lucide="users"></i>Atur anggota</button></div></article>`).join('')||'<div class="card empty small">Belum ada kelompok.</div>'}</div>
  ${none.length?`<div class="card card-b" style="margin-top:16px"><h3 style="font-size:15px">Belum masuk kelompok (${none.length})</h3><div class="chips" style="margin-top:8px">${none.map(s=>`<span class="chip">${esc(s.name)}</span>`).join('')}</div></div>`:''}`;
}};
ACT.rgTab=el=>{UI.rg.gol=el.dataset.g;render()};
ACT.rgPoin=el=>{const k=S.catalog.find(c=>c.id===el.dataset.id);if(upsert('catalog',{...k,meta:{...k.meta,poin:Math.max(0,(k.meta.poin||0)+Number(el.dataset.d))}}))render()};
ACT.rgAdd=()=>{const gol=UI.rg.gol;const m=openModal({title:`Tambah ${gol==='Siaga'?'barung':'regu'}`,size:'sm',body:`<div class="field"><label for="rgN">Nama</label><input class="input" id="rgN" placeholder="${gol==='Siaga'?'Barung Hijau':'Regu Rajawali'}"></div>`,foot:`<button class="btn" data-act="closeModal">Batal</button><button class="btn btn-primary" id="rgS">Simpan</button>`});
  m.querySelector('#rgS').onclick=()=>{const n=m.querySelector('#rgN').value.trim();if(!n)return toast('Isi nama kelompok.','warn');if(upsert('catalog',{id:newId('CAT'),eskulId:E(),kind:'kelompok',grp:'Kelompok',name:n,seq:nextSeq(),meta:{golongan:gol,poin:0}})){closeModal();render()}}};
ACT.rgEdit=el=>{const k=S.catalog.find(c=>c.id===el.dataset.id),gol=k.meta.golongan,mem=memberRows(s=>ext(s.id).golongan===gol);
  const m=openModal({title:`Anggota ${k.name}`,body:`<div class="check-list" style="max-height:340px">${mem.map(s=>{const x=ext(s.id),other=x.kelompokId&&x.kelompokId!==k.id?S.catalog.find(c=>c.id===x.kelompokId)?.name:'';return `<label style="display:grid;grid-template-columns:auto auto minmax(0,1fr) 120px;gap:10px"><input type="checkbox" value="${s.id}" ${x.kelompokId===k.id?'checked':''}>${avatar(s)}<span>${esc(s.name)}${other?` <small class="muted">· kini di ${esc(other)}</small>`:''}</span><select class="select" style="height:32px" data-role="${s.id}"><option value="">Anggota</option><option ${x.kelompokId===k.id&&x.kelompokRole==='Pemimpin'?'selected':''}>Pemimpin</option><option ${x.kelompokId===k.id&&x.kelompokRole==='Wakil'?'selected':''}>Wakil</option></select></label>`}).join('')}</div>`,
    foot:`<button class="btn btn-danger" id="rgDel" style="margin-right:auto"><i data-lucide="trash-2"></i>Hapus kelompok</button><button class="btn" data-act="closeModal">Batal</button><button class="btn btn-primary" id="rgSave"><i data-lucide="save"></i>Simpan</button>`});
  m.querySelector('#rgSave').onclick=()=>{const chosen=new Set($$('.check-list input:checked',m).map(i=>i.value)),roles={};$$('[data-role]',m).forEach(s=>roles[s.dataset.role]=s.value);
    if(Object.entries(roles).filter(([id,v])=>chosen.has(id)&&v==='Pemimpin').length>1)return toast('Pilih satu pemimpin saja.','warn');
    mem.forEach(s=>{const x=ext(s.id);if(chosen.has(s.id))setExt(s.id,{kelompokId:k.id,kelompokRole:roles[s.id]||''});else if(x.kelompokId===k.id)setExt(s.id,{kelompokId:'',kelompokRole:''})});closeModal();toast('Anggota kelompok disimpan.');render()};
  m.querySelector('#rgDel').onclick=async()=>{closeModal();if(await confirmBox({title:`Hapus ${k.name}?`,message:'Anggotanya menjadi belum masuk kelompok.',okText:'Hapus',danger:true})){mem.filter(s=>ext(s.id).kelompokId===k.id).forEach(s=>setExt(s.id,{kelompokId:'',kelompokRole:''}));removeRec('catalog',k.id);render()}}};

async function storeImage(dataUrl,path){
  if(App.mode==='cloud'&&Sync.client?.storage){try{const blob=await (await fetch(dataUrl)).blob();const {error}=await Sync.client.storage.from('karya').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;return Sync.client.storage.from('karya').getPublicUrl(path).data.publicUrl}
    catch(e){toast('Unggah ke Supabase Storage gagal ('+e.message+'). Gambar disimpan sebagai data kecil.','warn')}}
  return dataUrl}

    :`<div class="card card-b" style="border-top:4px solid ${eskulObj().color}"><div class="row" style="gap:14px">${avatar(s,'lg')}<div><h3 style="font-size:18px">${esc(s.name)}</h3><div class="small muted">Kelas ${esc(s.kelas)} · ${esc(eskulObj().name)}</div></div></div>${badges?`<div class="chips" style="margin-top:12px">${badges}</div>`:''}
      ${items.length?`<div style="margin-top:14px"><div class="row small" style="justify-content:space-between"><span class="muted">Materi dikuasai</span><b>${items.filter(i=>mastery(sid,i.id)===2).length}/${items.length}</b></div><div style="margin-top:6px">${progBar(items.filter(i=>mastery(sid,i.id)===2).length,items.filter(i=>mastery(sid,i.id)===1).length,items.length)}</div></div>`:''}</div>`;
  return pageHead(`Halo, ${firstName(s.name)}!`,'Ini catatan latihanmu. Lihat kemajuanmu dari waktu ke waktu dan terus semangat berlatih.')+
  (my.length>1?`<div class="esk-tabs">${my.map(id=>`<button class="btn btn-sm ${id===e?'btn-primary':''}" data-act="setEskul" data-id="${id}"><span class="esk-dot" style="background:${eskulById(id).color}"></span>${esc(eskulById(id).name)}</button>`).join('')}</div>`:'')+
  `<div class="prog-top">${idCard}
    <div class="card"><div class="card-h"><h3>Kehadiranmu</h3><span class="sub">${att.total} sesi tercatat</span></div><div class="card-b">
      <div class="ring" style="width:140px;height:140px"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R0}" fill="none" stroke="var(--surface-3)" stroke-width="12"/><circle cx="70" cy="70" r="${R0}" fill="none" stroke="var(--pitch)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-att.pct/100)}"/></svg><div class="ctr"><b>${fmtPct(att.pct)}</b><small>hadir</small></div></div>
      <div class="att-mini">${ATT_ORDER.map(k=>`<div><b style="color:var(${ATT[k].color})">${att[k]}</b><small>${ATT[k].label}</small></div>`).join('')}</div>

    </div></div></div>`:''}
  ${sp?`<div class="card" style="margin-top:16px"><div class="card-h"><h3>SKU ${esc(x.golongan)} ${esc(x.tingkat)}</h3><span class="sub">${sp.done}/${sp.total} butir lulus</span></div><div class="card-b"><ul class="ev-list">${sp.items.map(i=>`<li><span style="flex:1">${esc(i.name)}</span>${mastery(sid,i.id)===2?'<span class="badge b-ok">Lulus ✓</span>':'<span class="badge b-idle">Belum</span>'}</li>`).join('')}</ul></div></div>`:''}
  ${groups.length&&e!=='pramuka'?`<div class="card" style="margin-top:16px"><div class="card-h"><h3>Materi yang sudah kamu kuasai</h3></div><div class="card-b">${groups.map(g=>`<div class="grp"><span>${esc(g.name)}</span><small class="muted">${g.items.filter(i=>mastery(sid,i.id)===2).length}/${g.items.length}</small></div><div class="chips">${g.items.map(i=>{const v=mastery(sid,i.id);return `<span class="badge ${MS[v].cls}">${v===2?'✓ ':''}${esc(i.name)}</span>`}).join('')}</div>`).join('')}</div></div>`:''}

<script>

   AKUN PENGGUNA (khusus superuser)

function genPassword(n=8,digits=false){const cs=digits?'0123456789':'abcdefghjkmnpqrstuvwxyz23456789';const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(x=>cs[x%cs.length]).join('')}
function birthPassword(s){const [y,m,d]=String(s?.birthDate||'').split('-');return y&&m&&d?`${d}${m}${y}`:genPassword(6,true)}
function demoUsers(){let u=lsGet(LS_DEMO_USERS,null);if(Array.isArray(u))return u;
  const mk=(r,nama,username,sid=null,esk=[])=>({id:'demo-'+username,nama,username,email:toEmail(username),role:r,student_id:sid,active:true,eskul_ids:esk});
  u=[mk('superuser','Superuser Demo','admin.demo'),mk('guru','Guru Pembimbing Demo','guru.demo',null,['football','pramuka']),mk('koordinator','Koordinator Demo','koordinator.demo',null,['football','paskibra','pramuka']),mk('pelatih','Pelatih Demo','pelatih.demo',null,['silat','pramuka','menggambar','tari'])];
  S.students.filter(s=>s.status==='Aktif'&&!s.archived&&['STD001','STD002','STD005','STD009'].includes(s.id)).forEach(s=>u.push(mk('siswa',s.name,s.nisn,s.id)));

async function loadUsers(){
  if(App.mode==='demo'){UI.users=demoUsers();return}
  const {data,error}=await Sync.client.from('profiles').select('*').order('nama');if(error)throw error;UI.users=data||[]}
async function refreshUsers(){try{await loadUsers()}catch(e){toast('Gagal memuat akun: '+e.message,'err')}if(curRoute()==='akun')render()}
async function createAccount({nama,login,password,role:r,studentId,eskuls=[]}){
  const email=toEmail(login);
  if(App.mode==='demo'){const list=demoUsers();
    if(list.some(x=>x.email===email))throw new Error('Username/email sudah dipakai.');
    if(studentId&&list.some(x=>x.student_id===studentId))throw new Error('Siswa ini sudah punya akun.');
    list.push({id:newId('USR'),nama,username:login,email,role:r,student_id:studentId||null,active:true,eskul_ids:eskuls});lsSet(LS_DEMO_USERS,list);return}
  if((UI.users||[]).some(x=>x.student_id&&x.student_id===studentId))throw new Error('Siswa ini sudah punya akun.');
  const c=Sync.cfg();
  const tmp=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'eskul-mgmt-signup'}});
  let uid=null,existed=false;
  const {data,error}=await tmp.auth.signUp({email,password,options:{data:{nama}}});
  if(error){if(/registered|already exists/i.test(error.message))existed=true;else throw error}
  else{uid=data.user?.id||null;
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){existed=true;uid=null}
    else if(!data.session)toast('“Confirm email” masih aktif di Supabase: akun ini belum bisa dipakai sebelum dikonfirmasi. Matikan pengaturan itu (lihat README).','warn')}
  if(existed){ // akun sudah ada di Supabase Auth (mis. dibuat di dashboard): tautkan dan samakan kata sandi
    const f=await Sync.client.rpc('guru_find_user',{p_email:email});if(f.error)throw new Error(f.error.message);uid=f.data;
    if(!uid)throw new Error('Email sudah terdaftar tetapi akunnya tidak ditemukan.');
    const {data:ex}=await Sync.client.from('profiles').select('id').eq('id',uid).maybeSingle();if(ex)throw new Error('Akun dengan username/email ini sudah ada di daftar.');
    const p=await Sync.client.rpc('guru_set_password',{target:uid,new_password:password});if(p.error)throw new Error(p.error.message)}
  if(!uid)throw new Error('Akun tidak berhasil dibuat.');
  const {error:e2}=await Sync.client.from('profiles').insert({id:uid,email,username:login,nama,role:r,student_id:studentId||null,active:true,eskul_ids:eskuls});
  if(e2)throw new Error(/profiles_student_uq/.test(e2.message)?'Siswa ini sudah punya akun.':e2.message);
}
async function updateAccount(id,patch){
  if(App.mode==='demo'){const list=demoUsers();const i=list.findIndex(x=>x.id===id);if(i>=0){list[i]={...list[i],...patch};lsSet(LS_DEMO_USERS,list)}return}
  const {error}=await Sync.client.from('profiles').update({...patch,updated_at:new Date().toISOString()}).eq('id',id);
  if(error)throw new Error(/profiles_student_uq/.test(error.message)?'Siswa ini sudah terhubung ke akun lain.':error.message);
}

  const xb=m.querySelector('#crXls');if(xb)xb.onclick=()=>exportCredExcel(xb,rows);

  m.querySelector('#rpGen').onclick=()=>{m.querySelector('#rpPass').value=genPassword(8)};
  m.querySelector('#rpSave').onclick=async()=>{const pw=m.querySelector('#rpPass').value;if(pw.length<6)return toast('Kata sandi minimal 6 karakter.','warn');
    try{if(App.mode==='cloud'){const {error}=await Sync.client.rpc('guru_set_password',{target:u.id,new_password:pw});if(error)throw error}
      closeModal();showCredentials([{nama:u.nama,role:u.role,login:u.username,password:pw,kelas:st?.kelas||''}])}catch(e){toast(friendlyAuthError(e.message),'err')}}};
function genUsername(s,taken){const base=String(s.name||'siswa').toLowerCase().normalize('NFD').replace(/[^a-z\s]/g,'').trim().split(/\s+/)[0]||'siswa';
  const num=String(s.id||'').replace(/\D/g,'').slice(-3)||genPassword(3,true);let u=base+num,i=2;while(taken.has(u))u=base+num+(i++);taken.add(u);return u}
function usedLogins(){return new Set((UI.users||[]).map(u=>String(u.username||'').toLowerCase()))}
async function resetAccountPassword(u,pw){
  if(App.mode==='demo')return;
  const {error}=await Sync.client.rpc('guru_set_password',{target:u.id,new_password:pw});if(error)throw new Error(error.message)}
UI.bk={eskul:'',kelas:'',redo:false,scheme:'lahir'};
ACT.bulkSiswa=()=>{
  const f=UI.bk,acc=new Map((UI.users||[]).filter(u=>u.student_id).map(u=>[u.student_id,u]));
  const activeIn=(sid,e)=>S.memberships.some(m=>m.studentId===sid&&m.status==='Aktif'&&!m.archived&&(!e||m.eskulId===e));
  const cands=()=>allStudents().filter(s=>activeIn(s.id,f.eskul)&&(!f.kelas||levelOf(s.kelas)===f.kelas)&&(f.redo||!acc.has(s.id))).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.name.localeCompare(b.name,'id'));
  const m=openModal({title:'Buat Akun Siswa Otomatis',size:'lg',body:`
    <p class="small muted" style="margin:0">Username = <b>NISN</b> (siswa tanpa NISN dibuatkan username dari nama). Kata sandi dibuat otomatis sesuai pola di bawah. Setelah selesai, unduh Excel berisi daftar login dan <b>kartu login siap gunting</b>.</p>
    <div class="form-grid"><div class="field"><label for="bkEsk">Eskul</label><select class="select" id="bkEsk"><option value="">Semua eskul</option>${ESKULS.map(e=>`<option value="${e.id}" ${f.eskul===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="bkKls">Kelas</label><select class="select" id="bkKls"><option value="">Semua kelas</option>${LEVELS.map(l=>`<option value="${l}" ${f.kelas===l?'selected':''}>Kelas ${l}</option>`).join('')}</select></div></div>
    <div class="radio-cards"><label><input type="radio" name="bkPw" value="lahir" ${f.scheme==='lahir'?'checked':''}><span><b>Tanggal lahir</b><small>DDMMYYYY, mudah diingat siswa SD</small></span></label><label><input type="radio" name="bkPw" value="acak" ${f.scheme==='acak'?'checked':''}><span><b>Acak 6 angka</b><small>Lebih aman, dibagikan lewat kartu</small></span></label></div>
    <label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" id="bkRedo" ${f.redo?'checked':''}><span>Sertakan siswa yang sudah punya akun (kata sandinya <b>diatur ulang</b>, username tetap)</span></label>
    <div class="row" style="justify-content:space-between"><b class="small"><span id="bkCnt">0</span> dari <span id="bkTot">0</span> siswa dipilih</b><span><button class="link-btn" type="button" data-x="all">Pilih semua</button><button class="link-btn" type="button" data-x="none">Kosongkan</button></span></div>
    <div class="check-list" id="bkList"></div>
    <div id="bkProg" hidden><div class="row small" style="justify-content:space-between"><span id="bkTxt">Menyiapkan…</span><b id="bkPct">0%</b></div><div class="bar" style="margin-top:6px"><i id="bkBar" style="width:0%"></i></div></div>`,
    foot:`<button class="btn" data-act="closeModal">Batal</button><button class="btn btn-primary" id="bkGo"><i data-lucide="wand-sparkles"></i>Buat akun</button>`});
  const cnt=()=>{m.querySelector('#bkCnt').textContent=$$('#bkList input:checked',m).length};
  const draw=()=>{const list=cands(),taken=usedLogins();
    m.querySelector('#bkList').innerHTML=list.length?list.map(s=>{const u=acc.get(s.id),login=u?u.username:(s.nisn||genUsername(s,taken));
      return `<label><input type="checkbox" value="${s.id}" data-login="${esc(login)}" ${u?'':'checked'}>${avatar(s)}<span style="flex:1">${esc(s.name)} <small class="muted">· ${esc(s.kelas)}</small>${u?' <span class="badge b-warn">sudah punya akun</span>':''}</span><span class="cred small">${esc(login)}${!u&&!s.nisn?' <small class="muted">(otomatis)</small>':''}</span></label>`}).join('')
      :`<div class="empty" style="padding:22px"><i data-lucide="check-circle-2"></i><div>${f.redo?'Tidak ada siswa aktif pada filter ini.':'Semua siswa aktif pada filter ini sudah punya akun.'}</div></div>`;
    m.querySelector('#bkTot').textContent=list.length;cnt();icons()};
  draw();
  m.querySelector('#bkList').onchange=cnt;
  m.querySelector('#bkEsk').onchange=e=>{f.eskul=e.target.value;draw()};
  m.querySelector('#bkKls').onchange=e=>{f.kelas=e.target.value;draw()};
  m.querySelector('#bkRedo').onchange=e=>{f.redo=e.target.checked;draw()};
  $$('input[name=bkPw]',m).forEach(i=>i.onchange=()=>{f.scheme=i.value});
  m.querySelector('[data-x=all]').onclick=()=>{$$('#bkList input',m).forEach(i=>i.checked=true);cnt()};
  m.querySelector('[data-x=none]').onclick=()=>{$$('#bkList input',m).forEach(i=>i.checked=false);cnt()};
  m.querySelector('#bkGo').onclick=async()=>{
    const picks=$$('#bkList input:checked',m).map(i=>({id:i.value,login:i.dataset.login}));if(!picks.length)return toast('Pilih minimal satu siswa.','warn');
    const redo=picks.filter(p=>acc.has(p.id)).length;
    if(redo&&!await confirmBox({title:`Atur ulang ${redo} kata sandi?`,message:`${redo} siswa sudah punya akun. Kata sandi lama mereka tidak berlaku lagi setelah ini.`,okText:'Lanjutkan'}))return;
    m.querySelector('#bkGo').disabled=true;m.querySelector('#bkProg').hidden=false;$$('#bkList input,[data-x],select,input[type=radio],#bkRedo',m).forEach(i=>i.disabled=true);
    if(App.mode==='cloud')await Sync.flush();
    const res=[];let stop='';
    for(let i=0;i<picks.length;i++){const s=rawStu(picks[i].id),u=acc.get(s.id),pw=f.scheme==='lahir'?birthPassword(s):genPassword(6,true),row={nama:s.name,kelas:s.kelas,role:'siswa',login:picks[i].login,password:''};
      m.querySelector('#bkTxt').textContent=`${u?'Mengatur ulang':'Membuat'} akun ${s.name} (${i+1}/${picks.length})`;
      if(stop)row.status='Belum diproses: '+stop;
      else{try{if(u){await resetAccountPassword(u,pw);row.status='Kata sandi diatur ulang'}
          else{if(Sync.q.some(j=>j.key==='students'&&j.id===s.id))throw new Error('Data siswa belum terkirim ke server.');await createAccount({nama:s.name,login:row.login,password:pw,role:'siswa',studentId:s.id});row.status='Dibuat'}
          row.password=pw}
        catch(e){const msg=friendlyAuthError(e.message);row.status=msg;if(/membatasi|dimatikan|tidak dapat terhubung|Pratinjau/i.test(msg))stop=msg}}
      res.push(row);const p=Math.round((i+1)/picks.length*100);m.querySelector('#bkPct').textContent=p+'%';m.querySelector('#bkBar').style.width=p+'%';
    }
    if(modalStack.includes(m))closeModal();await refreshUsers();showCredentials(res);
  };
};
/* Akun otomatis saat guru menambah siswa baru */
async function autoAccountFor(sid){const a=S.meta.autoAccount||{};if(a.on===false||!isSuper())return;
  const s=rawStu(sid);if(!s)return;
  try{if(!UI.users)await loadUsers();if(UI.users.some(u=>u.student_id===sid))return;
    if(App.mode==='cloud'){await Sync.flush();if(Sync.q.some(j=>j.key==='students'&&j.id===sid))throw new Error('Data siswa belum terkirim ke server.')}
    const login=s.nisn||genUsername(s,usedLogins()),pw=a.scheme==='acak'?genPassword(6,true):birthPassword(s);
    await createAccount({nama:s.name,login,password:pw,role:'siswa',studentId:sid});await loadUsers();
    showCredentials([{nama:s.name,kelas:s.kelas,role:'siswa',login,password:pw,status:'Dibuat otomatis'}])}
  catch(e){toast(`Akun ${s.name} belum dibuat otomatis: ${friendlyAuthError(e.message)} Buat lewat menu Akun Pengguna.`,'warn')}}
ACT.autoAccToggle=el=>{S.meta.autoAccount={...(S.meta.autoAccount||{scheme:'lahir'}),on:el.checked};if(saveMeta())toast(el.checked?'Akun siswa baru akan dibuat otomatis.':'Pembuatan akun otomatis dimatikan.','info');render()};
ACT.autoAccScheme=el=>{S.meta.autoAccount={...(S.meta.autoAccount||{on:true}),scheme:el.value};if(saveMeta())toast('Pola kata sandi disimpan.','info')};

</script>

/* ---------- Boot ---------- */
(async function boot(){
  document.body.classList.add('locked');
  bindSearch();
  if(Sync.enabled()){
    showLogin({checking:true});
    try{if(await Sync.restore())return enterCloud()}
    catch(e){return showLogin({error:friendlyAuthError(e.message)})}
    return showLogin();
  }
  const dr=lsGet(LS_DEMO_ROLE,null);if(dr&&ROLE_DEF[dr])return enterDemo(dr);
  showLogin();
})();
</script>
